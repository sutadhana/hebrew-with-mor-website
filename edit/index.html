<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="editor-api" content="https://site-editor.EXAMPLE.workers.dev">
<title>Edit your website</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "HM Calibri"; font-display: swap; src: url("../assets/fonts/calibri.woff2") format("woff2"); }
:root {
  --cream: #FDFCF7; --beige: #F4F1E9; --sand: #E8E3D5; --sage: #7D8C7A; --sage-dark: #6A7867;
  --tan: #D4A373; --ink: #2D302E; --muted: #6b6f6c; --danger: #a5523f;
  --font: "Calibri Light", "HM Calibri", Calibri, Carlito, "Segoe UI", sans-serif;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-weight: 300; color: var(--ink); background: var(--beige); font-size: 17px; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* Sign in */
.signin { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.signin form { width: 100%; max-width: 360px; background: var(--cream); border-radius: 18px; padding: 32px 26px; box-shadow: 0 6px 30px rgba(45,48,46,.08); text-align: center; }
.signin h1 { font-size: 28px; font-weight: 300; margin: 6px 0 4px; }
.signin p { color: var(--muted); margin: 0 0 22px; }
.signin input { width: 100%; padding: 13px 14px; border: 1px solid var(--sand); border-radius: 10px; background: #fff; margin-bottom: 12px; }
.signin .err { color: var(--danger); min-height: 1.3em; margin: 4px 0 0; font-size: 15px; }
.mark { width: 46px; height: 46px; border-radius: 50%; background: var(--sage); display: inline-grid; place-items: center; color: #fff; }
.mark svg { width: 22px; height: 22px; }

/* Buttons */
.btn { border: 0; border-radius: 999px; padding: 11px 20px; background: var(--sage); color: #fff; transition: background .15s; }
.btn:hover { background: var(--sage-dark); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--sand); }
.btn.ghost:hover { background: var(--sand); }
.btn.small { padding: 7px 14px; font-size: 15px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.wide { width: 100%; }

/* App */
.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--cream); border-bottom: 1px solid var(--sand); }
.top .name { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .name small { color: var(--muted); display: block; font-size: 13px; }
.top .spacer { flex: 1; }
.top select { max-width: 42vw; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--sand); background: #fff; }
.work { display: grid; grid-template-columns: 1fr 400px; min-height: 0; }
.stage { position: relative; min-height: 0; background: var(--sand); }
.stage iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
.badge { position: absolute; bottom: 12px; left: 12px; background: var(--ink); color: #fff; font-size: 13px; padding: 5px 11px; border-radius: 999px; pointer-events: none; opacity: .88; }
.badge.preview { background: var(--tan); color: var(--ink); }

.side { display: grid; grid-template-rows: 1fr auto auto; min-height: 0; background: var(--cream); border-left: 1px solid var(--sand); }
.log { overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
.msg.bot { background: var(--beige); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--sage); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.note { align-self: center; background: transparent; color: var(--muted); font-size: 14px; text-align: center; padding: 2px 8px; }
.msg img { display: block; max-width: 160px; border-radius: 8px; margin-top: 6px; }
.typing { display: inline-flex; gap: 4px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); opacity: .4; animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: 1; } }

.changes { margin: 0 12px 10px; padding: 12px 14px; border-radius: var(--radius); background: #fff; border: 1px solid var(--tan); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.changes span { flex: 1; min-width: 150px; font-size: 15px; }

.compose { padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--sand); }
.attach-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--beige); border-radius: 10px; padding: 5px 8px; margin-bottom: 8px; font-size: 14px; }
.attach-chip img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
.attach-chip button { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: flex-end; }
.row textarea { flex: 1; resize: none; min-height: 46px; max-height: 140px; padding: 11px 14px; border: 1px solid var(--sand); border-radius: 22px; background: #fff; line-height: 1.35; }
.icon-btn { width: 46px; height: 46px; flex: none; border-radius: 50%; border: 1px solid var(--sand); background: #fff; display: grid; place-items: center; }
.icon-btn.send { background: var(--sage); border-color: var(--sage); color: #fff; }
.icon-btn svg { width: 20px; height: 20px; }

/* History */
dialog.hist { border: 0; border-radius: 18px; padding: 22px; width: min(440px, calc(100% - 32px)); background: var(--cream); color: var(--ink); }
dialog.hist::backdrop { background: rgba(45,48,46,.35); }
dialog.hist h2 { font-weight: 300; margin: 0 0 12px; font-size: 22px; }
dialog.hist ul { list-style: none; padding: 0; margin: 0 0 16px; max-height: 50vh; overflow-y: auto; }
dialog.hist li { padding: 9px 0; border-bottom: 1px solid var(--sand); font-size: 15px; }
dialog.hist li small { color: var(--muted); display: block; }
dialog.hist .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

@media (max-width: 820px) {
  .work { grid-template-columns: 1fr; grid-template-rows: 44vh 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--sand); }
  .top .name small { display: none; }
}
</style>
</head>
<body>

<section class="signin" id="signin">
  <form id="signin-form">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
    <h1>Edit your website</h1>
    <p>Change anything by just asking.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="btn wide" type="submit">Sign in</button>
    <p class="err" id="signin-err"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <div class="name"><span id="site-name">Your website</span><small>Changes go live only when you press Publish</small></div>
    <span class="spacer"></span>
    <select id="page-select" aria-label="Page"></select>
    <button class="btn ghost small" id="hist-btn">History</button>
  </header>
  <div class="work">
    <div class="stage">
      <iframe id="frame" title="Your website"></iframe>
      <span class="badge" id="badge">Live site</span>
    </div>
    <aside class="side">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="changes" id="changes" hidden>
        <span id="changes-text">You have changes that aren't live yet.</span>
        <button class="btn ghost small" id="discard-btn">Discard</button>
        <button class="btn small" id="publish-btn">Publish</button>
      </div>
      <form class="compose" id="compose">
        <div class="attach-chip" id="chip" hidden><img id="chip-img" alt=""><span>Photo attached</span><button type="button" id="chip-x" aria-label="Remove photo">×</button></div>
        <div class="row">
          <label class="icon-btn" title="Add a photo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg>
            <input type="file" id="file" accept="image/*" hidden>
          </label>
          <textarea id="input" rows="1" placeholder="What would you like to change?"></textarea>
          <button class="icon-btn send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
        </div>
      </form>
    </aside>
  </div>
</div>

<dialog class="hist" id="hist">
  <h2>Recent changes</h2>
  <ul id="hist-list"><li>Loading…</li></ul>
  <div class="actions">
    <button class="btn ghost small" id="hist-close">Close</button>
    <button class="btn small" id="undo-btn">Undo last change</button>
  </div>
</dialog>

<script>
(function () {
  var API = document.querySelector('meta[name="editor-api"]').content.replace(/\/$/, '');
  var $ = function (id) { return document.getElementById(id); };
  var store = {
    get: function (k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };

  var token = store.get('ed-token');
  var pending = store.get('ed-pending') || {};
  var history = store.get('ed-history') || [];
  var uploads = {};          // path -> {b64, dataUrl}
  var attached = null;       // path of photo waiting to be sent
  var pages = [];
  var currentPath = 'index.html';
  var goingLive = null;      // published pages shown until GitHub updates
  var busy = false;

  function save() { store.set('ed-pending', pending); store.set('ed-history', history); }

  function api(path, body) {
    body = body || {};
    body.token = token;
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401 && d.signin) { signOut(); throw new Error(d.error || 'Please sign in again.'); }
          if (!r.ok) throw new Error(d.error || 'Something went wrong.');
          return d;
        });
      });
  }

  /* ---------- Sign in ---------- */
  $('signin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('signin-err').textContent = '';
    fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not sign in.'); return d; }); })
      .then(function (d) { token = d.token; store.set('ed-token', token); store.set('ed-site', d.siteName); start(); })
      .catch(function (err) { $('signin-err').textContent = err.message === 'Failed to fetch' ? 'Can’t reach the editor right now.' : err.message; });
  });

  function signOut() { token = null; store.del('ed-token'); $('app').hidden = true; $('signin').hidden = false; }

  /* ---------- Pages and frame ---------- */
  function label(p) {
    if (p === 'index.html') return 'Home';
    var s = p.replace(/\/index\.html$/, '').replace(/\.html$/, '').split('/').pop().replace(/[-_]+/g, ' ').replace(/\d+$/, '').trim();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dirOf(p) { return p.replace(/[^/]*$/, ''); }
  function pathFromLocation(loc) {
    var p = loc.pathname.replace(/^\/+/, '');
    if (!p || p.slice(-1) === '/') p += 'index.html';
    return p;
  }

  function previewHtml(path, html) {
    var h = html
      .replace(/<script[^>]*googletagmanager[^>]*><\/script>/gi, '')
      .replace(/gtag\('config'[^)]*\);?/g, '');
    Object.keys(uploads).forEach(function (p) { h = h.split('/' + p).join(uploads[p].dataUrl); });
    var inject = '<base href="' + location.origin + '/' + dirOf(path) + '">' +
      '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
      'if(a){e.preventDefault();var t=document.querySelector(a.getAttribute("href"));t&&t.scrollIntoView({behavior:"smooth"});}});<\/script>';
    return h.replace(/<head[^>]*>/i, function (m) { return m + inject; });
  }

  var keepScroll = 0;
  function show(path, opts) {
    currentPath = path;
    $('page-select').value = path;
    var frame = $('frame');
    var html = pending[path] ? pending[path].content : (goingLive && goingLive[path]);
    try { keepScroll = opts && opts.keepScroll && frame.contentWindow ? frame.contentWindow.scrollY : 0; } catch (e) { keepScroll = 0; }
    if (html) {
      frame.srcdoc = previewHtml(path, html);
      $('badge').textContent = pending[path] ? 'Preview — not live yet' : 'Going live…';
      $('badge').className = 'badge preview';
    } else {
      frame.removeAttribute('srcdoc');
      frame.src = '/' + dirOf(path) + (path.slice(-10) === 'index.html' ? '' : path.split('/').pop());
      $('badge').textContent = 'Live site';
      $('badge').className = 'badge';
    }
  }

  $('frame').addEventListener('load', function () {
    var w = this.contentWindow;
    try {
      if (w.location.href === 'about:srcdoc') { if (keepScroll) w.scrollTo(0, keepScroll); keepScroll = 0; return; }
      var p = pathFromLocation(w.location);
      if (pages.indexOf(p) === -1) return;
      currentPath = p;
      $('page-select').value = p;
      if (pending[p] || (goingLive && goingLive[p])) show(p);
    } catch (e) {}
  });

  $('page-select').addEventListener('change', function () { show(this.value); });

  /* ---------- Chat ---------- */
  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bubble(kind, text, img) {
    var d = document.createElement('div');
    d.className = 'msg ' + kind;
    d.innerHTML = esc(text) + (img ? '<img src="' + img + '" alt="">' : '');
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
    return d;
  }
  function typing() {
    var d = bubble('bot', '');
    d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    return d;
  }

  function refreshChanges() {
    var n = Object.keys(pending).length;
    $('changes').hidden = n === 0;
    $('changes-text').textContent = n === 1
      ? 'You have a change that isn’t live yet.'
      : 'You have changes on ' + n + ' pages that aren’t live yet.';
    $('log').scrollTop = $('log').scrollHeight;
  }

  $('input').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 140) + 'px'; });
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 821px)').matches) { e.preventDefault(); $('compose').requestSubmit(); }
  });

  $('compose').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;
    var text = $('input').value.trim();
    if (!text && !attached) return;
    if (!text) text = 'I added a photo.';
    var photo = attached;
    var fullText = photo ? text + '\n\n(Attached photo: /' + photo + ')' : text;
    bubble('me', text, photo && uploads[photo].dataUrl);
    $('input').value = ''; $('input').style.height = '';
    clearAttach();
    busy = true;
    var t = typing();
    api('/api/chat', { message: fullText, history: history, pending: pending, page: currentPath, uploads: Object.keys(uploads) })
      .then(function (d) {
        t.remove();
        bubble('bot', d.reply);
        history.push({ role: 'user', content: fullText }, { role: 'assistant', content: d.reply });
        history = history.slice(-20);
        pending = d.pending || {};
        lastNote = text;
        save();
        refreshChanges();
        if (d.changed && d.changed.length) {
          var target = d.changed.indexOf(currentPath) !== -1 ? currentPath : d.changed[0];
          show(target, { keepScroll: target === currentPath });
        }
      })
      .catch(function (err) { t.remove(); bubble('note', err.message === 'Failed to fetch' ? 'Can’t reach the editor. Check your connection and try again.' : err.message); })
      .then(function () { busy = false; });
  });

  /* ---------- Photos ---------- */
  function clearAttach() { attached = null; $('chip').hidden = true; $('file').value = ''; }
  $('chip-x').addEventListener('click', clearAttach);
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var img = new Image();
    var url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var dataUrl = c.toDataURL('image/jpeg', 0.85);
      var base = (f.name.replace(/\.[^.]*$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'photo').slice(0, 30);
      var path = 'assets/uploads/' + base + '-' + Date.now().toString(36) + '.jpg';
      uploads[path] = { dataUrl: dataUrl, b64: dataUrl.split(',')[1] };
      attached = path;
      $('chip-img').src = dataUrl;
      $('chip').hidden = false;
      $('input').focus();
    };
    img.onerror = function () { URL.revokeObjectURL(url); bubble('note', 'That file couldn’t be opened as a photo.'); };
    img.src = url;
  });

  /* ---------- Publish / discard ---------- */
  var lastNote = '';
  $('publish-btn').addEventListener('click', function () {
    if (busy) return;
    busy = true;
    var btn = this; btn.disabled = true; btn.textContent = 'Publishing…';
    var up = {};
    Object.keys(uploads).forEach(function (p) { up[p] = uploads[p].b64; });
    api('/api/publish', { pending: pending, uploads: up, note: lastNote || 'update' })
      .then(function () {
        goingLive = {};
        Object.keys(pending).forEach(function (p) { goingLive[p] = pending[p].content; });
        pending = {}; history = []; save(); refreshChanges();
        bubble('note', 'Published ✓ Your website updates in about a minute.');
        show(currentPath, { keepScroll: true });
        setTimeout(function () { goingLive = null; show(currentPath, { keepScroll: true }); }, 75000);
      })
      .catch(function (err) { bubble('note', err.message); })
      .then(function () { busy = false; btn.disabled = false; btn.textContent = 'Publish'; });
  });

  $('discard-btn').addEventListener('click', function () {
    if (!confirm('Throw away the changes that aren’t live yet?')) return;
    pending = {}; history = []; save(); refreshChanges();
    bubble('note', 'Changes discarded. Your live site wasn’t touched.');
    show(currentPath);
  });

  /* ---------- History / undo ---------- */
  $('hist-btn').addEventListener('click', function () {
    $('hist-list').innerHTML = '<li>Loading…</li>';
    $('hist').showModal();
    api('/api/history').then(function (d) {
      $('hist-list').innerHTML = d.items.map(function (i) {
        var when = new Date(i.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
        return '<li>' + esc(i.message.replace(/^Site edit:\s*/, '')) + '<small>' + when + (i.byEditor ? '' : ' · by your web designer') + '</small></li>';
      }).join('') || '<li>No changes yet.</li>';
      $('undo-btn').disabled = !(d.items[0] && d.items[0].byEditor);
    }).catch(function (err) { $('hist-list').innerHTML = '<li>' + esc(err.message) + '</li>'; });
  });
  $('hist-close').addEventListener('click', function () { $('hist').close(); });
  $('undo-btn').addEventListener('click', function () {
    if (!confirm('Undo the most recent change? Your site goes back to how it was before it.')) return;
    var btn = this; btn.disabled = true;
    api('/api/undo').then(function () {
      $('hist').close();
      bubble('note', 'Undone ✓ Your website goes back in about a minute.');
      setTimeout(function () { show(currentPath, { keepScroll: true }); }, 75000);
    }).catch(function (err) { bubble('note', err.message); btn.disabled = false; });
  });

  /* ---------- Start ---------- */
  function start() {
    $('signin').hidden = true; $('app').hidden = false;
    $('site-name').textContent = store.get('ed-site') || 'Your website';
    api('/api/pages').then(function (d) {
      pages = d.pages.map(function (p) { return p.path; });
      $('page-select').innerHTML = pages.map(function (p) { return '<option value="' + esc(p) + '">' + esc(label(p)) + '</option>'; }).join('');
      show(pages.indexOf('index.html') !== -1 ? 'index.html' : pages[0]);
    }).catch(function (err) { bubble('note', err.message); });
    if (!$('log').children.length) {
      bubble('bot', 'Hi! Tell me what you’d like to change, for example:\n“Change the lesson price to $40”\n“Add a new review from Sarah”\n“Replace the photo at the top with this one”\n\nYou’ll see a preview first. Nothing goes live until you press Publish.');
    }
    refreshChanges();
  }

  if (token) start();
})();
</script>
</body>
</html>
