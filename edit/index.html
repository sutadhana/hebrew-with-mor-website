<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="editor-api" content="https://site-editor.resight-it.workers.dev">
<meta name="avatar-style" content="chibi">
<title>Edit your website</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "HM Calibri"; font-display: swap; src: url("../assets/fonts/calibri.woff2") format("woff2"); }
:root {
  --cream: #FDFCF7; --beige: #F4F1E9; --sand: #E8E3D5; --sage: #7D8C7A; --sage-dark: #6A7867;
  --tan: #D4A373; --tan-deep: #C4874A; --ink: #2D302E; --muted: #6b6f6c; --live: #5E7A5A;
  --font: "Calibri Light", "HM Calibri", Calibri, Carlito, "Segoe UI", sans-serif;
  --chat-fs: 17px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: var(--font); font-weight: 300; color: var(--ink); background: var(--beige); font-size: 17px; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- Sign in ---------- */
.signin { height: 100%; overflow: auto; display: grid; place-items: center; padding: 24px 16px; }
.signin form { width: 100%; max-width: 380px; background: var(--cream); border-radius: 18px; padding: 26px 26px 30px; box-shadow: 0 6px 30px rgba(45,48,46,.08); text-align: center; }
.signin .face { width: 120px; margin: 0 auto -4px; }
.signin h1 { font-size: 28px; font-weight: 300; margin: 4px 0 4px; }
.signin p { color: var(--muted); margin: 0 0 20px; }
.signin input { width: 100%; padding: 13px 14px; border: 1px solid var(--sand); border-radius: 10px; background: #fff; margin-bottom: 12px; }
.signin .err { color: #a5523f; min-height: 1.3em; margin: 6px 0 0; font-size: 15px; }

/* ---------- Buttons ---------- */
.btn { border: 0; border-radius: 999px; padding: 11px 22px; background: var(--sage); color: #fff; font-size: 17px; transition: background .15s, transform .1s; white-space: nowrap; }
.btn:hover { background: var(--sage-dark); }
.btn:active { transform: scale(.97); }
.btn.light { background: #fff; color: var(--ink); }
.btn.light:hover { background: var(--beige); }
.btn.outline { background: transparent; color: inherit; border: 1.5px solid currentColor; }
.btn.big { padding: 12px 26px; font-size: 18px; }
.btn:disabled { opacity: .55; cursor: default; }
.btn.wide { width: 100%; }

/* ---------- App layout: banner on top, the site underneath ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.banner { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px 18px; color: #fff; background: var(--live); min-height: 64px; transition: background .25s; position: relative; z-index: 3; }
.banner .state { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 220px; }
.banner .dot { width: 14px; height: 14px; border-radius: 50%; background: #fff; flex: none; box-shadow: 0 0 0 4px rgba(255,255,255,.25); }
.banner b { font-weight: 400; font-size: 25px; letter-spacing: .02em; display: block; line-height: 1.15; }
.banner small { font-size: 16px; opacity: .92; display: block; }
.banner .acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.banner select { padding: 9px 12px; border-radius: 999px; border: 0; background: rgba(255,255,255,.95); color: var(--ink); max-width: 220px; }
.banner.preview { background: var(--tan-deep); }
.banner.preview .dot { animation: pulse 1.4s infinite; }
.banner.publishing { background: var(--sage-dark); }
.banner.version { background: var(--ink); }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(255,255,255,0); } }
.stage { flex: 1; position: relative; background: var(--sand); }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
.stage.preview { box-shadow: inset 0 0 0 6px var(--tan-deep); }
.stage.preview iframe, .stage.version iframe { inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }
.stage.version { box-shadow: inset 0 0 0 6px var(--ink); }

/* ---------- Floating chat window ---------- */
.chat { position: fixed; z-index: 10; width: 370px; height: 400px; min-width: 280px; min-height: 250px; background: var(--cream); border-radius: 16px; box-shadow: 0 12px 40px rgba(45,48,46,.28), 0 0 0 1px rgba(45,48,46,.06); display: flex; flex-direction: column; font-size: var(--chat-fs); }
.chat.folding { transition: transform .38s cubic-bezier(.5,0,.75,.3), opacity .38s; transform: scale(.08); opacity: 0; }
.chat.opening { animation: openUp .38s cubic-bezier(.2,1.2,.4,1); }
@keyframes openUp { from { transform: scale(.1); opacity: 0; } }
.chat-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 96px; border-bottom: 1px solid var(--sand); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; min-height: 52px; position: relative; }
.chat-head:active { cursor: grabbing; }
.chat-head .who { position: absolute; left: 6px; bottom: -2px; width: 86px; pointer-events: none; }
.chat-head .title { flex: 1; line-height: 1.15; font-size: 18px; }
.chat-head .title small { display: block; font-size: 13px; color: var(--muted); }
.hbtn { width: 36px; height: 36px; border-radius: 10px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink); font-size: 15px; }
.hbtn:hover { background: var(--beige); }
.hbtn svg { width: 20px; height: 20px; }
.log { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 9px; overscroll-behavior: contain; }
.msg { max-width: 88%; padding: .55em .85em; border-radius: 14px; line-height: 1.38; white-space: pre-wrap; word-wrap: break-word; }
.msg.bot { background: var(--beige); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--sage); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.note { align-self: center; background: transparent; color: var(--muted); font-size: .85em; text-align: center; padding: 2px 6px; }
.msg img { display: block; max-width: 150px; border-radius: 8px; margin-top: 6px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); opacity: .4; animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 50% { opacity: 1; } }
.compose { padding: 8px 10px 10px; border-top: 1px solid var(--sand); }
.attach-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--beige); border-radius: 10px; padding: 4px 8px; margin-bottom: 6px; font-size: 14px; }
.attach-chip img { width: 30px; height: 30px; object-fit: cover; border-radius: 6px; }
.attach-chip button { border: 0; background: none; font-size: 18px; line-height: 1; color: var(--muted); }
.row { display: flex; gap: 6px; align-items: flex-end; }
.row textarea { flex: 1; resize: none; min-height: 44px; max-height: 120px; padding: 10px 13px; border: 1px solid var(--sand); border-radius: 14px; background: #fff; line-height: 1.3; font-size: max(16px, .95em); }
.ibtn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--sand); background: #fff; display: grid; place-items: center; color: var(--ink); }
.ibtn svg { width: 21px; height: 21px; }
.ibtn.send { background: var(--sage); border-color: var(--sage); color: #fff; }
.ibtn.mic.on { background: #c0504d; border-color: #c0504d; color: #fff; animation: micpulse 1.2s infinite; }
@keyframes micpulse { 50% { box-shadow: 0 0 0 7px rgba(192,80,77,.18); } }
.grip { position: absolute; right: 0; bottom: 0; width: 26px; height: 26px; cursor: nwse-resize; touch-action: none; border-bottom-right-radius: 16px; }
.grip::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 10px; border-right: 2px solid #b9b3a3; border-bottom: 2px solid #b9b3a3; border-bottom-right-radius: 3px; }

/* ---------- Minimized: Mor with the chat in his pocket ---------- */
.pocket { position: fixed; z-index: 10; width: 96px; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; filter: drop-shadow(0 6px 14px rgba(45,48,46,.25)); }
.pocket .tap { position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%); white-space: nowrap; font-size: 14px; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 12px; }
.pocket.pop { animation: pocketPop .45s cubic-bezier(.2,1.5,.4,1); }
@keyframes pocketPop { from { transform: scale(.6); } }
.pocket.nudge { animation: nudge 3s 1.5s infinite; }
@keyframes nudge { 0%,82%,100% { transform: translateY(0); } 88% { transform: translateY(-7px); } 94% { transform: translateY(0); } }

/* avatar animation parts */
.mor .mor-arm { transform-box: view-box; transform-origin: 36px 150px; }
.waving .mor-arm { animation: wave 1.6s ease-in-out 1; }
@keyframes wave { 0%,100%{transform:rotate(0)} 15%{transform:rotate(-16deg)} 30%{transform:rotate(12deg)} 45%{transform:rotate(-14deg)} 60%{transform:rotate(10deg)} 75%{transform:rotate(-6deg)} }
.mor .mor-blink { transform-box: view-box; animation: eyeblink 4.5s infinite; }
@keyframes eyeblink { 0%,94%,100%{transform:scaleY(1)} 96%{transform:scaleY(.1)} }
.mor .mor-note { transform-box: view-box; transform: translateY(16px); opacity: 0; transition: transform .4s .2s, opacity .2s .2s; }
.pocket .mor .mor-note { transform: translateY(0); opacity: 1; }

/* ---------- History ---------- */
dialog.hist { border: 0; border-radius: 16px; padding: 22px; width: min(480px, calc(100% - 24px)); background: var(--cream); color: var(--ink); }
dialog.hist::backdrop { background: rgba(45,48,46,.4); }
dialog.hist h2 { font-weight: 300; margin: 0 0 4px; font-size: 24px; }
dialog.hist p { margin: 0 0 12px; color: var(--muted); font-size: 15px; }
dialog.hist ul { list-style: none; padding: 0; margin: 0 0 16px; max-height: 55vh; overflow-y: auto; }
dialog.hist li button { width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 10px; border-radius: 10px; display: flex; gap: 12px; align-items: baseline; }
dialog.hist li button:hover { background: var(--beige); }
dialog.hist li .when { flex: none; width: 118px; font-size: 15px; color: var(--muted); }
dialog.hist li .what { flex: 1; font-size: 16px; }
dialog.hist li.now .when { color: var(--live); font-weight: 400; }
dialog.hist .actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
dialog.hist .actions .btn { font-size: 16px; padding: 9px 18px; }
.btn.plain { background: transparent; color: var(--ink); border: 1px solid var(--sand); }
.btn.plain:hover { background: var(--beige); }

@media (max-width: 640px) {
  .banner { padding: 10px 12px; min-height: 0; }
  .banner b { font-size: 20px; }
  .banner small { font-size: 14px; }
  .banner .acts { flex-wrap: nowrap; gap: 6px; width: 100%; }
  .banner .acts .btn { padding: 8px 12px; font-size: 15px; }
  .banner .acts .btn.big { padding: 9px 14px; font-size: 16px; }
  .banner select { max-width: 104px; padding: 8px 8px; font-size: 15px; }
  .chat-head .who { width: 74px; }
  .chat-head { padding-left: 82px; }
}
</style>
</head>
<body>

<section class="signin" id="signin">
  <form id="signin-form">
    <div class="face waving" id="signin-face"></div>
    <h1>Edit your website</h1>
    <p>Change anything by just asking.</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password" required>
    <button class="btn wide" type="submit">Sign in</button>
    <p class="err" id="signin-err"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <div class="banner" id="banner">
    <div class="state"><span class="dot"></span><div><b id="banner-title">LIVE SITE</b><small id="banner-sub">This is what your visitors see right now.</small></div></div>
    <div class="acts" id="banner-acts"></div>
  </div>
  <div class="stage" id="stage"><iframe id="frame" title="Your website"></iframe></div>
</div>

<div class="chat" id="chat" hidden>
  <div class="chat-head" id="chat-head">
    <div class="who" id="head-face"></div>
    <div class="title"><span id="bot-name">Mor</span><small>Drag me anywhere</small></div>
    <button class="hbtn" id="font-down" title="Smaller text" aria-label="Smaller text">A−</button>
    <button class="hbtn" id="font-up" title="Bigger text" aria-label="Bigger text" style="font-size:19px">A+</button>
    <button class="hbtn" id="minimize" title="Put the chat in my pocket" aria-label="Minimize">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 13h12"/></svg>
    </button>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <form class="compose" id="compose">
    <div class="attach-chip" id="chip" hidden><img id="chip-img" alt=""><span>Photo attached</span><button type="button" id="chip-x" aria-label="Remove photo">×</button></div>
    <div class="row">
      <label class="ibtn" title="Add a photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg>
        <input type="file" id="file" accept="image/*" hidden>
      </label>
      <button type="button" class="ibtn mic" id="mic" title="Speak instead of typing" aria-label="Speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Type or tap the mic…"></textarea>
      <button class="ibtn send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </div>
  </form>
  <div class="grip" id="grip" title="Drag to resize"></div>
</div>

<div class="pocket" id="pocket" hidden role="button" aria-label="Open the chat" tabindex="0"><div id="pocket-face"></div><span class="tap">Tap to chat</span></div>

<dialog class="hist" id="hist">
  <h2>Earlier versions</h2>
  <p>Tap a version to see how your site looked. You can bring it back from there.</p>
  <ul id="hist-list"><li>Loading…</li></ul>
  <div class="actions">
    <button class="btn plain" id="undo-btn">Undo last change</button>
    <button class="btn" id="hist-close">Close</button>
  </div>
</dialog>

<script>
/* Mor avatar — three drawing styles of one small, friendly character.
   MorAvatar.svg(style) → SVG markup. style: 'chibi' | 'line' | 'badge'
   Parts with classes for animation: .mor-arm (waving forearm), .mor-note (paper peeking from pocket),
   .mor-blink (eyes), .mor-pocket (pocket). */
(function () {
  var STYLES = {
    chibi: {
      skin: '#EDBF98', skinShade: '#D9A47C', hair: '#3A2F2A', tee: '#8C9A88', teeShade: '#76846F',
      stroke: 'none', sw: 0, eye: '#2E221C', mouth: '#8A3B33', cheek: '#E58C7A', stubble: '#6A4F40',
      headR: 46, headY: 74, eyeR: [5.2, 6.4], cheeks: true, bg: null
    },
    line: {
      skin: '#F5DFC8', skinShade: '#E9C9A9', hair: '#4A403A', tee: '#E3E8DC', teeShade: '#C9D2C2',
      stroke: '#55634F', sw: 2.2, eye: '#33403A', mouth: '#9C4E43', cheek: '#E9A58F', stubble: '#7F6B5C',
      headR: 43, headY: 75, eyeR: [4.2, 5.2], cheeks: true, bg: null
    },
    badge: {
      skin: '#E6B48D', skinShade: '#CF9A72', hair: '#352B26', tee: '#7D8C7A', teeShade: '#6A7867',
      stroke: 'none', sw: 0, eye: '#2B201B', mouth: '#7E352E', cheek: '#D98470', stubble: '#5E4639',
      headR: 37, headY: 80, eyeR: [3.4, 4], cheeks: false, bg: '#E8E3D5'
    }
  };

  function svg(style, opts) {
    var s = STYLES[style] || STYLES.chibi;
    opts = opts || {};
    var R = s.headR, cx = 80, cy = s.headY;
    var st = s.stroke === 'none' ? '' : ' stroke="' + s.stroke + '" stroke-width="' + s.sw + '" stroke-linejoin="round" stroke-linecap="round"';
    var thin = s.stroke === 'none' ? '' : ' stroke="' + s.stroke + '" stroke-width="' + (s.sw * 0.8) + '" stroke-linecap="round"';
    var neckTop = cy + R * 0.78;
    var eyeY = cy + R * 0.1, eyeDX = R * 0.36;
    var mouthY = cy + R * 0.42;
    var id = 'm' + Math.random().toString(36).slice(2, 7);

    var parts = [];
    parts.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" class="mor mor-' + style + '" aria-hidden="true">');
    if (s.bg) {
      parts.push('<defs><clipPath id="' + id + '"><circle cx="80" cy="96" r="76"/></clipPath></defs>');
      parts.push('<circle cx="80" cy="96" r="76" fill="' + s.bg + '"/>');
      parts.push('<g clip-path="url(#' + id + ')">');
    }

    // Waving arm (viewer's left): upper sleeve + forearm/hand group
    parts.push('<g class="mor-arm">' +
      '<path d="M30,150 Q22,136 22,114 L33,113 Q34,132 42,146 Z" fill="' + s.skin + '"' + st + '/>' +
      '<g transform="translate(27,104)">' +
      '<ellipse cx="0" cy="0" rx="9.5" ry="11" fill="' + s.skin + '"' + st + '/>' +
      '<path d="M-7,-6 L-7,-15 M-2.5,-8 L-2.5,-18 M2,-8 L2,-17.5 M6.5,-6 L6.5,-14" stroke="' + s.skin + '" stroke-width="4.4" stroke-linecap="round"/>' +
      (s.stroke === 'none' ? '' : '<path d="M-7,-6 L-7,-15 M-2.5,-8 L-2.5,-18 M2,-8 L2,-17.5 M6.5,-6 L6.5,-14" stroke="' + s.stroke + '" stroke-width="1" stroke-linecap="round" opacity=".55"/>') +
      '<path d="M9,2 Q15,-2 14,-8" stroke="' + s.skin + '" stroke-width="4.4" stroke-linecap="round" fill="none"/>' +
      '</g></g>');

    parts.push('<path d="M38,134 Q25,144 25,163 Q36,168 47,164 Q47,148 57,137 Z" fill="' + s.tee + '"' + st + '/>');
    // Body: t-shirt
    parts.push('<path d="M22,182 C22,150 40,130 62,126 L98,126 C120,130 138,150 138,182 Z" fill="' + s.tee + '"' + st + '/>');
    // Neck
    parts.push('<path d="M70,' + (neckTop - 6) + ' L70,128 Q80,136 90,128 L90,' + (neckTop - 6) + ' Z" fill="' + s.skinShade + '"' + st + '/>');
    // Collar
    parts.push('<path d="M64,126 Q80,142 96,126" fill="none" stroke="' + s.teeShade + '" stroke-width="' + (s.sw ? s.sw : 3) + '" stroke-linecap="round"/>');
    // Pocket (his left = viewer's right)
    parts.push('<g class="mor-pocket"><rect x="99" y="148" width="22" height="20" rx="3" fill="' + s.teeShade + '"' + (st || '') + '/>' +
      '<path d="M101,152.5 L119,152.5" stroke="' + s.tee + '" stroke-width="1.3" stroke-dasharray="2 2"/></g>');
    // Little note peeking from the pocket (shown when minimized)
    parts.push('<g class="mor-note"><rect x="103" y="138" width="15" height="14" rx="3" fill="#fff" stroke="' + (s.stroke === 'none' ? s.teeShade : s.stroke) + '" stroke-width="1.2"/>' +
      '<circle cx="107" cy="145" r="1.3" fill="' + s.tee + '"/><circle cx="110.5" cy="145" r="1.3" fill="' + s.tee + '"/><circle cx="114" cy="145" r="1.3" fill="' + s.tee + '"/></g>');
    // Re-draw pocket front over note
    parts.push('<rect class="mor-pocket-front" x="99" y="152" width="22" height="16" rx="3" fill="' + s.teeShade + '"' + st + '/>');

    // Ears
    parts.push('<ellipse cx="' + (cx - R * 0.98) + '" cy="' + (cy + R * 0.12) + '" rx="' + R * 0.17 + '" ry="' + R * 0.24 + '" fill="' + s.skinShade + '"' + st + '/>');
    parts.push('<ellipse cx="' + (cx + R * 0.98) + '" cy="' + (cy + R * 0.12) + '" rx="' + R * 0.17 + '" ry="' + R * 0.24 + '" fill="' + s.skinShade + '"' + st + '/>');
    // Head (slightly taller than wide, rounder chin)
    var hw = R * 0.95, top = cy - R, bot = cy + R * 0.98;
    parts.push('<path d="M' + (cx - hw) + ',' + cy + ' C' + (cx - hw) + ',' + (top - 2) + ' ' + (cx + hw) + ',' + (top - 2) + ' ' + (cx + hw) + ',' + cy +
      ' C' + (cx + hw) + ',' + (bot - R * 0.25) + ' ' + (cx + R * 0.45) + ',' + bot + ' ' + cx + ',' + bot +
      ' C' + (cx - R * 0.45) + ',' + bot + ' ' + (cx - hw) + ',' + (bot - R * 0.25) + ' ' + (cx - hw) + ',' + cy + ' Z" fill="' + s.skin + '"' + st + '/>');
    // Stubble along jaw and chin (soft)
    parts.push('<path d="M' + (cx - hw + 2) + ',' + (cy + R * 0.18) + ' C' + (cx - hw + 4) + ',' + (bot - R * 0.15) + ' ' + (cx - R * 0.35) + ',' + (bot + 1) + ' ' + cx + ',' + (bot + 1) +
      ' C' + (cx + R * 0.35) + ',' + (bot + 1) + ' ' + (cx + hw - 4) + ',' + (bot - R * 0.15) + ' ' + (cx + hw - 2) + ',' + (cy + R * 0.18) +
      ' C' + (cx + hw - 10) + ',' + (cy + R * 0.62) + ' ' + (cx + R * 0.3) + ',' + (cy + R * 0.66) + ' ' + cx + ',' + (cy + R * 0.66) +
      ' C' + (cx - R * 0.3) + ',' + (cy + R * 0.66) + ' ' + (cx - hw + 10) + ',' + (cy + R * 0.62) + ' ' + (cx - hw + 2) + ',' + (cy + R * 0.18) + ' Z" fill="' + s.stubble + '" opacity=".22"/>');
    // Mustache shadow
    parts.push('<path d="M' + (cx - R * 0.26) + ',' + (mouthY - R * 0.1) + ' Q' + cx + ',' + (mouthY - R * 0.2) + ' ' + (cx + R * 0.26) + ',' + (mouthY - R * 0.1) + '" stroke="' + s.stubble + '" stroke-width="' + R * 0.06 + '" stroke-linecap="round" fill="none" opacity=".16"/>');
    // Buzzed hair: cap with gently receding hairline
    var hy = top + R * 0.42;
    parts.push('<path d="M' + (cx - hw - 0.5) + ',' + (cy - R * 0.02) + ' C' + (cx - hw - 1) + ',' + (top - 3) + ' ' + (cx + hw + 1) + ',' + (top - 3) + ' ' + (cx + hw + 0.5) + ',' + (cy - R * 0.02) +
      ' L' + (cx + hw - R * 0.06) + ',' + (cy - R * 0.08) +
      ' C' + (cx + hw - R * 0.12) + ',' + (hy + R * 0.02) + ' ' + (cx + R * 0.42) + ',' + (hy + R * 0.12) + ' ' + (cx + R * 0.3) + ',' + (hy + R * 0.05) +
      ' Q' + cx + ',' + (hy - R * 0.06) + ' ' + (cx - R * 0.3) + ',' + (hy + R * 0.05) +
      ' C' + (cx - R * 0.42) + ',' + (hy + R * 0.12) + ' ' + (cx - hw + R * 0.12) + ',' + (hy + R * 0.02) + ' ' + (cx - hw + R * 0.06) + ',' + (cy - R * 0.08) + ' Z" fill="' + s.hair + '" opacity=".88"' + st + '/>');
    // Brows
    parts.push('<path d="M' + (cx - eyeDX - R * 0.14) + ',' + (eyeY - R * 0.24) + ' Q' + (cx - eyeDX) + ',' + (eyeY - R * 0.32) + ' ' + (cx - eyeDX + R * 0.15) + ',' + (eyeY - R * 0.25) +
      ' M' + (cx + eyeDX - R * 0.15) + ',' + (eyeY - R * 0.25) + ' Q' + (cx + eyeDX) + ',' + (eyeY - R * 0.32) + ' ' + (cx + eyeDX + R * 0.14) + ',' + (eyeY - R * 0.24) +
      '" stroke="' + s.hair + '" stroke-width="' + R * 0.07 + '" stroke-linecap="round" fill="none"/>');
    // Eyes (smiling, with highlight)
    parts.push('<g class="mor-blink" style="transform-origin:' + cx + 'px ' + eyeY + 'px">' +
      '<ellipse cx="' + (cx - eyeDX) + '" cy="' + eyeY + '" rx="' + s.eyeR[0] + '" ry="' + s.eyeR[1] + '" fill="' + s.eye + '"/>' +
      '<ellipse cx="' + (cx + eyeDX) + '" cy="' + eyeY + '" rx="' + s.eyeR[0] + '" ry="' + s.eyeR[1] + '" fill="' + s.eye + '"/>' +
      '<circle cx="' + (cx - eyeDX + 1.4) + '" cy="' + (eyeY - 1.6) + '" r="' + s.eyeR[0] * 0.36 + '" fill="#fff"/>' +
      '<circle cx="' + (cx + eyeDX + 1.4) + '" cy="' + (eyeY - 1.6) + '" r="' + s.eyeR[0] * 0.36 + '" fill="#fff"/></g>');
    // Smile lines under eyes
    parts.push('<path d="M' + (cx - eyeDX - 4) + ',' + (eyeY + s.eyeR[1] + 2.5) + ' q4,2.4 8,0 M' + (cx + eyeDX - 4) + ',' + (eyeY + s.eyeR[1] + 2.5) + ' q4,2.4 8,0" stroke="' + s.skinShade + '" stroke-width="1.2" fill="none" stroke-linecap="round"/>');
    // Cheeks
    if (s.cheeks) {
      parts.push('<ellipse cx="' + (cx - eyeDX - R * 0.1) + '" cy="' + (eyeY + R * 0.3) + '" rx="' + R * 0.14 + '" ry="' + R * 0.08 + '" fill="' + s.cheek + '" opacity=".35"/>');
      parts.push('<ellipse cx="' + (cx + eyeDX + R * 0.1) + '" cy="' + (eyeY + R * 0.3) + '" rx="' + R * 0.14 + '" ry="' + R * 0.08 + '" fill="' + s.cheek + '" opacity=".35"/>');
    }
    // Big open smile with teeth
    var mw = R * 0.38;
    parts.push('<path d="M' + (cx - mw) + ',' + mouthY + ' Q' + cx + ',' + (mouthY + R * 0.5) + ' ' + (cx + mw) + ',' + mouthY + ' Q' + cx + ',' + (mouthY + R * 0.06) + ' ' + (cx - mw) + ',' + mouthY + ' Z" fill="' + s.mouth + '"' + thin + '/>');
    parts.push('<path d="M' + (cx - mw + 2) + ',' + (mouthY + 1) + ' Q' + cx + ',' + (mouthY + R * 0.16) + ' ' + (cx + mw - 2) + ',' + (mouthY + 1) + ' Q' + cx + ',' + (mouthY + R * 0.07) + ' ' + (cx - mw + 2) + ',' + (mouthY + 1) + ' Z" fill="#fff"/>');
    // Nose
    parts.push('<path d="M' + (cx - 1) + ',' + (eyeY + R * 0.12) + ' Q' + (cx + R * 0.08) + ',' + (eyeY + R * 0.3) + ' ' + (cx - R * 0.05) + ',' + (eyeY + R * 0.33) + '" stroke="' + s.skinShade + '" stroke-width="1.8" fill="none" stroke-linecap="round"/>');

    if (s.bg) parts.push('</g><circle cx="80" cy="96" r="76" fill="none" stroke="' + s.teeShade + '" stroke-width="2"/>');
    parts.push('</svg>');
    return parts.join('');
  }

  window.MorAvatar = { svg: svg, styles: Object.keys(STYLES) };
})();

</script>
<script>
(function () {
  var API = document.querySelector('meta[name="editor-api"]').content.replace(/\/$/, '');
  var AVATAR = document.querySelector('meta[name="avatar-style"]').content;
  var $ = function (id) { return document.getElementById(id); };
  var ss = {
    get: function (k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del: function (k) { try { sessionStorage.removeItem(k); } catch (e) {} }
  };
  var ls = {
    get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };

  var token = ss.get('ed-token');
  var pending = ss.get('ed-pending') || {};
  var history = ss.get('ed-history') || [];
  var botName = ss.get('ed-bot') || 'Mor';
  var uploads = {};
  var attached = null;
  var pages = [];
  var currentPath = 'index.html';
  var mode = 'live';            // live | preview | publishing | version
  var goingLive = null;
  var viewing = null;           // {sha, label}
  var busy = false;
  var lastNote = '';

  function save() { ss.set('ed-pending', pending); ss.set('ed-history', history); }
  function face(el, extra) { el.innerHTML = MorAvatar.svg(AVATAR); if (extra) el.classList.add(extra); }
  function wave(el) { el.classList.remove('waving'); void el.offsetWidth; el.classList.add('waving'); }
  face($('signin-face'));

  function api(path, body) {
    body = body || {};
    body.token = token;
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401 && d.signin) { signOut(); throw new Error(d.error || 'Please sign in again.'); }
          if (!r.ok) throw new Error(d.error || 'Something went wrong.');
          return d;
        });
      }, function () { throw new Error('Can’t reach the editor. Check your connection and try again.'); });
  }

  /* ---------- Sign in ---------- */
  $('signin-form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('signin-err').textContent = '';
    fetch(API + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) })
      .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Could not sign in.'); return d; }); })
      .then(function (d) {
        token = d.token; ss.set('ed-token', token);
        botName = d.assistantName || 'Mor'; ss.set('ed-bot', botName);
        start();
      })
      .catch(function (err) { $('signin-err').textContent = err.message === 'Failed to fetch' ? 'Can’t reach the editor right now.' : err.message; });
  });
  function signOut() { token = null; ss.del('ed-token'); $('app').hidden = true; $('chat').hidden = true; $('pocket').hidden = true; $('signin').hidden = false; }

  /* ---------- Banner ---------- */
  function setMode(m) {
    mode = m;
    var b = $('banner'), acts = $('banner-acts');
    b.className = 'banner ' + m;
    $('stage').className = 'stage ' + (m === 'preview' ? 'preview' : m === 'version' ? 'version' : '');
    acts.innerHTML = '';
    var add = function (html) { var t = document.createElement('div'); t.innerHTML = html; var el = t.firstChild; acts.appendChild(el); return el; };
    if (m === 'preview') {
      var n = Object.keys(pending).length;
      $('banner-title').textContent = 'PREVIEW — NOT LIVE YET';
      $('banner-sub').textContent = n > 1 ? 'Changes on ' + n + ' pages. Visitors still see the old version.' : 'Visitors still see the old version until you publish.';
      add('<button class="btn outline big" id="discard-btn">Discard</button>').onclick = discard;
      add('<button class="btn light big" id="publish-btn">Publish</button>').onclick = publish;
    } else if (m === 'publishing') {
      $('banner-title').textContent = 'GOING LIVE…';
      $('banner-sub').textContent = 'Your website updates in about a minute.';
    } else if (m === 'version') {
      $('banner-title').textContent = 'EARLIER VERSION — ' + viewing.label.toUpperCase();
      $('banner-sub').textContent = 'Just looking. Your live site hasn’t changed.';
      add('<button class="btn outline big">Back to now</button>').onclick = function () { viewing = null; refreshMode(); show(currentPath); };
      var r = add('<button class="btn light big" id="restore-btn">Bring this version back</button>');
      r.onclick = restoreVersion;
      if (viewing.restorable === false) { r.disabled = true; r.title = 'This version can’t be brought back here'; }
    } else {
      $('banner-title').textContent = 'LIVE SITE';
      $('banner-sub').textContent = 'This is what your visitors see right now.';
    }
    if (m !== 'publishing' && pages.length > 1) {
      var sel = add('<select id="page-select" aria-label="Page"></select>');
      sel.innerHTML = pages.map(function (p) { return '<option value="' + esc(p) + '">' + esc(label(p)) + '</option>'; }).join('');
      sel.value = currentPath;
      sel.onchange = function () { show(this.value); };
    }
    if (m === 'live' || m === 'preview') add('<button class="btn outline">History</button>').onclick = openHistory;
  }
  function refreshMode() {
    if (viewing) return setMode('version');
    if (Object.keys(pending).length) return setMode('preview');
    if (goingLive) return setMode('publishing');
    setMode('live');
  }

  /* ---------- Pages and the site frame ---------- */
  function label(p) {
    if (p === 'index.html') return 'Home';
    var s = p.replace(/\/index\.html$/, '').replace(/\.html$/, '').split('/').pop().replace(/[-_]+/g, ' ').replace(/\d+$/, '').trim();
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function dirOf(p) { return p.replace(/[^/]*$/, ''); }
  function urlOf(p) { return '/' + dirOf(p) + (/(^|\/)index\.html$/.test(p) ? '' : p.split('/').pop()); }
  function pathFromLocation(loc) {
    var p = loc.pathname.replace(/^\/+/, '');
    if (!p || p.slice(-1) === '/') p += 'index.html';
    return p;
  }
  function previewHtml(path, html) {
    var h = html.replace(/<script[^>]*googletagmanager[^>]*><\/script>/gi, '').replace(/gtag\('config'[^)]*\);?/g, '');
    Object.keys(uploads).forEach(function (p) { h = h.split('/' + p).join(uploads[p].dataUrl); });
    var inject = '<base href="' + location.origin + '/' + dirOf(path) + '">' +
      '<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");' +
      'if(a){e.preventDefault();var t=document.querySelector(a.getAttribute("href"));t&&t.scrollIntoView({behavior:"smooth"});}});<\/script>';
    return h.replace(/<head[^>]*>/i, function (m) { return m + inject; });
  }

  var keepScroll = 0, showToken = 0;
  function show(path, opts) {
    currentPath = path;
    var sel = $('page-select'); if (sel) sel.value = path;
    var frame = $('frame');
    try { keepScroll = opts && opts.keepScroll && frame.contentWindow ? frame.contentWindow.scrollY : 0; } catch (e) { keepScroll = 0; }
    var my = ++showToken;
    if (viewing) {
      api('/api/version', { sha: viewing.sha, page: path }).then(function (d) {
        if (my !== showToken) return;
        viewing.restorable = d.restorable;
        setMode('version');
        if (d.content) frame.srcdoc = previewHtml(path, d.content);
        else { frame.srcdoc = '<p style="font:20px sans-serif;padding:40px;color:#555">' + (d.note || 'Not available.') + '</p>'; }
      }).catch(function (err) { bubble('note', err.message); });
      return;
    }
    var html = pending[path] ? pending[path].content : (goingLive && goingLive[path]);
    if (html) frame.srcdoc = previewHtml(path, html);
    else { frame.removeAttribute('srcdoc'); frame.src = urlOf(path); }
  }
  $('frame').addEventListener('load', function () {
    var w = this.contentWindow;
    try {
      if (w.location.href === 'about:srcdoc') { if (keepScroll) w.scrollTo(0, keepScroll); keepScroll = 0; return; }
      var p = pathFromLocation(w.location);
      if (pages.indexOf(p) === -1) return;
      currentPath = p;
      var sel = $('page-select'); if (sel) sel.value = p;
      if (pending[p] || (goingLive && goingLive[p]) || viewing) show(p);
    } catch (e) {}
  });

  /* ---------- Chat window: drag, resize, minimize ---------- */
  var chat = $('chat'), pocket = $('pocket');
  var box = ls.get('ed-box');
  function clampBox() {
    var vw = window.innerWidth, vh = window.innerHeight, small = vw < 640;
    if (!box) box = small ? { w: vw - 16, h: Math.round(vh * 0.42), x: 8, y: vh - Math.round(vh * 0.42) - 8 } : { w: 380, h: 410, x: vw - 400, y: vh - 430 };
    box.w = Math.max(280, Math.min(box.w, vw - 8)); box.h = Math.max(250, Math.min(box.h, vh - 70));
    box.x = Math.max(4, Math.min(box.x, vw - box.w - 4)); box.y = Math.max(70, Math.min(box.y, vh - box.h - 4));
    chat.style.left = box.x + 'px'; chat.style.top = box.y + 'px'; chat.style.width = box.w + 'px'; chat.style.height = box.h + 'px';
  }
  function placePocket() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var p = ls.get('ed-pocket') || { x: box.x + box.w - 108, y: box.y + box.h - 130 };
    p.x = Math.max(4, Math.min(p.x, vw - 100)); p.y = Math.max(70, Math.min(p.y, vh - 128));
    pocket.style.left = p.x + 'px'; pocket.style.top = p.y + 'px';
    return p;
  }
  window.addEventListener('resize', function () { clampBox(); if (!pocket.hidden) placePocket(); });

  function dragger(handle, onMove, onEnd, onTap) {
    handle.addEventListener('pointerdown', function (e) {
      if (e.target.closest('button, select, textarea, input, label')) return;
      e.preventDefault();
      var sx = e.clientX, sy = e.clientY, moved = false;
      handle.setPointerCapture(e.pointerId);
      function mv(ev) {
        var dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
        moved = true; onMove(dx, dy);
      }
      function up() {
        handle.removeEventListener('pointermove', mv); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
        if (moved) onEnd(); else if (onTap) onTap();
      }
      handle.addEventListener('pointermove', mv); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
      dragger.start = { x: box.x, y: box.y, w: box.w, h: box.h, px: parseFloat(pocket.style.left) || 0, py: parseFloat(pocket.style.top) || 0 };
    });
  }
  dragger($('chat-head'), function (dx, dy) { box.x = dragger.start.x + dx; box.y = dragger.start.y + dy; clampBox(); }, function () { ls.set('ed-box', box); });
  dragger($('grip'), function (dx, dy) { box.w = dragger.start.w + dx; box.h = dragger.start.h + dy; clampBox(); }, function () { ls.set('ed-box', box); });
  dragger(pocket, function (dx, dy) {
    pocket.classList.remove('nudge');
    ls.set('ed-pocket', { x: dragger.start.px + dx, y: dragger.start.py + dy }); placePocket();
  }, function () {}, openChat);
  pocket.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChat(); } });

  function minimize() {
    var p = placePocket();
    chat.style.transformOrigin = (p.x + 48 - box.x) + 'px ' + (p.y + 100 - box.y) + 'px';
    chat.classList.add('folding');
    setTimeout(function () {
      chat.hidden = true; chat.classList.remove('folding');
      pocket.hidden = false; pocket.classList.remove('pop', 'nudge'); void pocket.offsetWidth; pocket.classList.add('pop');
      setTimeout(function () { pocket.classList.remove('pop'); pocket.classList.add('nudge'); }, 500);
      ls.set('ed-min', true);
    }, 380);
  }
  function openChat() {
    pocket.hidden = true; chat.hidden = false;
    chat.classList.remove('opening'); void chat.offsetWidth; chat.classList.add('opening');
    ls.set('ed-min', false);
    setTimeout(function () { wave($('head-face')); }, 250);
    $('log').scrollTop = $('log').scrollHeight;
  }
  $('minimize').addEventListener('click', minimize);

  /* ---------- Text size ---------- */
  var fs = ls.get('ed-fs') || 17;
  function setFs(v) { fs = Math.max(14, Math.min(26, v)); document.documentElement.style.setProperty('--chat-fs', fs + 'px'); ls.set('ed-fs', fs); }
  setFs(fs);
  $('font-up').onclick = function () { setFs(fs + 2); };
  $('font-down').onclick = function () { setFs(fs - 2); };

  /* ---------- Messages ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function bubble(kind, text, img) {
    var d = document.createElement('div');
    d.className = 'msg ' + kind;
    d.innerHTML = esc(text) + (img ? '<img src="' + img + '" alt="">' : '');
    $('log').appendChild(d);
    $('log').scrollTop = $('log').scrollHeight;
    if (kind !== 'me' && pocket.hidden === false && kind === 'bot') openChat();
    return d;
  }
  function typing() { var d = bubble('bot', ''); d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>'; return d; }

  $('input').addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 641px)').matches) { e.preventDefault(); $('compose').requestSubmit(); }
  });

  $('compose').addEventListener('submit', function (e) {
    e.preventDefault();
    stopMic();
    if (busy) return;
    var text = $('input').value.trim();
    if (!text && !attached) return;
    if (viewing) { viewing = null; refreshMode(); show(currentPath); }
    if (!text) text = 'I added a photo.';
    var photo = attached;
    var fullText = photo ? text + '\n\n(Attached photo: /' + photo + ')' : text;
    bubble('me', text, photo && uploads[photo].dataUrl);
    $('input').value = ''; $('input').style.height = '';
    clearAttach();
    busy = true;
    var t = typing();
    api('/api/chat', { message: fullText, history: history, pending: pending, page: currentPath, uploads: Object.keys(uploads) })
      .then(function (d) {
        t.remove();
        bubble('bot', d.reply);
        history.push({ role: 'user', content: fullText }, { role: 'assistant', content: d.reply });
        history = history.slice(-20);
        pending = d.pending || {};
        lastNote = text;
        save();
        refreshMode();
        if (d.changed && d.changed.length) {
          var target = d.changed.indexOf(currentPath) !== -1 ? currentPath : d.changed[0];
          show(target, { keepScroll: target === currentPath });
        }
      })
      .catch(function (err) { t.remove(); bubble('note', err.message); })
      .then(function () { busy = false; });
  });

  /* ---------- Voice ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, base = '';
  if (!SR) { $('mic').addEventListener('click', function () { bubble('note', 'Speaking isn’t supported in this browser. Tip: use the microphone on your phone’s keyboard, or open this page in Chrome or Safari.'); }); }
  else {
    $('mic').addEventListener('click', function () { if (rec) stopMic(); else startMic(); });
  }
  function startMic() {
    rec = new SR();
    rec.lang = navigator.language || 'en-US';
    rec.continuous = true; rec.interimResults = true;
    base = $('input').value ? $('input').value.replace(/\s*$/, ' ') : '';
    rec.onresult = function (e) {
      var finalText = '', interim = '';
      for (var i = 0; i < e.results.length; i++) { (e.results[i].isFinal ? (finalText += e.results[i][0].transcript) : (interim += e.results[i][0].transcript)); }

    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') bubble('note', 'Please allow the microphone for this page to speak your request.');
      stopMic();
    };

  }
  function stopMic() {
    if (!rec) return;
    var r = rec; rec = null;
    try { r.stop(); } catch (e) {}
    $('mic').classList.remove('on'); $('input').placeholder = 'Type or tap the mic…';
  }

  /* ---------- Photos ---------- */
  function clearAttach() { attached = null; $('chip').hidden = true; $('file').value = ''; }
  $('chip-x').addEventListener('click', clearAttach);
  $('file').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var dataUrl = c.toDataURL('image/jpeg', 0.85);
      var nm = (f.name.replace(/\.[^.]*$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'photo').slice(0, 30);
      var path = 'assets/uploads/' + nm + '-' + Date.now().toString(36) + '.jpg';
      uploads[path] = { dataUrl: dataUrl, b64: dataUrl.split(',')[1] };
      attached = path; $('chip-img').src = dataUrl; $('chip').hidden = false; $('input').focus();
    };
    img.onerror = function () { URL.revokeObjectURL(url); bubble('note', 'That file couldn’t be opened as a photo.'); };
    img.src = url;
  });

  /* ---------- Publish / discard ---------- */
  function publish() {
    if (busy) return;
    busy = true;
    var btn = $('publish-btn'); btn.disabled = true; btn.textContent = 'Publishing…';
    var up = {};
    Object.keys(uploads).forEach(function (p) { up[p] = uploads[p].b64; });
    api('/api/publish', { pending: pending, uploads: up, note: lastNote || 'update' })
      .then(function () {
        goingLive = {};
        Object.keys(pending).forEach(function (p) { goingLive[p] = pending[p].content; });
        pending = {}; history = []; save();
        refreshMode();
        bubble('bot', 'Published! 🎉 Your website updates in about a minute.');
        show(currentPath, { keepScroll: true });
        setTimeout(function () { goingLive = null; refreshMode(); show(currentPath, { keepScroll: true }); }, 75000);
      })
      .catch(function (err) { bubble('note', err.message); btn.disabled = false; btn.textContent = 'Publish'; })
      .then(function () { busy = false; });
  }
  function discard() {
    if (!confirm('Throw away the changes that aren’t live yet?')) return;
    pending = {}; history = []; save(); refreshMode();
    bubble('note', 'Changes discarded. Your live site wasn’t touched.');
    show(currentPath);
  }

  /* ---------- History: earlier versions ---------- */
  function when(iso) {
    var d = new Date(iso), now = new Date(), y = new Date(now); y.setDate(now.getDate() - 1);
    var time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return 'Today, ' + time;
    if (d.toDateString() === y.toDateString()) return 'Yesterday, ' + time;
    return d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ', ' + time;
  }
  function describe(i) {
    var m = i.message.replace(/^Site edit:\s*/, '');
    return i.byEditor ? m : 'Update by your web designer';
  }
  function openHistory() {
    $('hist-list').innerHTML = '<li style="padding:10px">Loading…</li>';
    $('hist').showModal();
    api('/api/history').then(function (d) {
      var ul = $('hist-list'); ul.innerHTML = '';
      d.items.forEach(function (i, n) {
        var li = document.createElement('li'); if (n === 0) li.className = 'now';
        li.innerHTML = '<button><span class="when">' + esc(n === 0 ? 'Now (live)' : when(i.date)) + '</span><span class="what">' + esc(describe(i)) + '</span></button>';
        li.firstChild.onclick = function () {
          $('hist').close();
          if (n === 0) { viewing = null; refreshMode(); show(currentPath); return; }
          viewing = { sha: i.sha, label: when(i.date) };
          setMode('version');
          show(currentPath);
        };
        ul.appendChild(li);
      });
      $('undo-btn').disabled = !(d.items[0] && d.items[0].byEditor);
    }).catch(function (err) { $('hist-list').innerHTML = '<li style="padding:10px">' + esc(err.message) + '</li>'; });
  }
  $('hist-close').onclick = function () { $('hist').close(); };
  $('undo-btn').onclick = function () {
    if (!confirm('Undo the most recent change? Your site goes back to how it was before it.')) return;
    var btn = this; btn.disabled = true;
    api('/api/undo').then(function () {
      $('hist').close();
      bubble('bot', 'Done — I undid the last change. Your website goes back in about a minute.');
      setTimeout(function () { show(currentPath, { keepScroll: true }); }, 75000);
    }).catch(function (err) { bubble('note', err.message); btn.disabled = false; });
  };
  function restoreVersion() {
    if (Object.keys(pending).length && !confirm('You have unpublished changes. They will be thrown away. Continue?')) return;
    if (!confirm('Bring back the version from ' + viewing.label + '? Your current site is kept in History, so you can always come back.')) return;
    var btn = $('restore-btn'); btn.disabled = true; btn.textContent = 'Bringing it back…';
    api('/api/restore', { sha: viewing.sha, label: viewing.label }).then(function () {
      var lbl = viewing.label;
      pending = {}; history = []; save();
      viewing = null; goingLive = null;
      setMode('publishing');
      bubble('bot', 'Done! Your site is going back to the version from ' + lbl + '. It updates in about a minute.');
      setTimeout(function () { refreshMode(); show(currentPath, { keepScroll: true }); }, 75000);
    }).catch(function (err) { bubble('note', err.message); btn.disabled = false; btn.textContent = 'Bring this version back'; });
  }

  /* ---------- Start ---------- */
  function start() {
    $('signin').hidden = true; $('app').hidden = false;
    face($('head-face')); face($('pocket-face'));
    $('bot-name').textContent = botName;
    clampBox();
    if (ls.get('ed-min')) { chat.hidden = true; placePocket(); pocket.hidden = false; pocket.classList.add('nudge'); }
    else { chat.hidden = false; setTimeout(function () { wave($('head-face')); }, 400); }
    api('/api/pages').then(function (d) {
      pages = d.pages.map(function (p) { return p.path; });
      refreshMode();
      show(pages.indexOf('index.html') !== -1 ? 'index.html' : pages[0]);
    }).catch(function (err) { refreshMode(); bubble('note', err.message); });
    if (!$('log').children.length) {
      bubble('bot', 'Hey, it’s ' + botName + '! 👋 How can I help you today?\n\nJust tell me what to change — a price, a sentence, a photo — by typing or by tapping the mic.');
    }
    refreshMode();
  }
  if (token) start();
})();
</script>
</body>
</html>
